project:
  name: scgpt-mechinterp-atlas
  seed: 42

paths:
  scgpt_repo: external/scGPT
  scgpt_checkpoint: external/scGPT_checkpoints/whole-human/best_model.pt
  scgpt_vocab: external/scGPT_checkpoints/whole-human/vocab.json
  tabula_sapiens_h5ad: data/raw/tabula_sapiens_kidney.h5ad
  gene_info_csv: external/gene_info.csv
  hgnc_alias_tsv: external/hgnc_complete_set.txt
  processed_h5ad: outputs/atlas/kidney/tabula_sapiens_kidney_processed.h5ad
  attention_scores: outputs/atlas/kidney/attention_scores.npy
  attention_counts: outputs/atlas/kidney/attention_counts.npy
  attention_scores_head_layer: outputs/atlas/kidney/attention_scores_head_layer.npy
  attention_counts_head_layer: outputs/atlas/kidney/attention_counts_head_layer.npy
  network_edges: outputs/atlas/kidney/inferred_edges.tsv
  dorothea_tsv: external/networks/trrust_human.tsv

preprocess:
  min_genes: 200
  min_cells: 3
  normalize_total: 10000
  log1p: true
  hvg: 2000

scgpt_dataset:
  max_genes: 1600
  include_zero: false
  sort_by_expression: true
  pad_token_id: null
  cls_token_id: null

model:
  entrypoint: scgpt.model.TransformerModel
  model_args: {}
  prefix_to_strip: null
  forward_key_map:
    gene_ids: src
    gene_values: values
    src_key_padding_mask: src_key_padding_mask

attention:
  reduce_layers: false
  reduce_heads: false
  max_cells: 2000
  score_dtype: float16
  count_dtype: int32
  share_counts: true

network:
  threshold_percentile: 95
  top_k: 50
  candidate_sources_from_dorothea: true
  candidate_targets_from_dorothea: true

evaluation:
  dorothea_confidence:
    - A
    - B
    - C
    - D

atlas:
  output_dir: outputs/atlas/kidney
  pr_max_pairs: 100000
  seed: 42
  cluster_top_n: 500
  cluster_jaccard_threshold: 0.07
  cluster_use_candidate_sources: false
  cluster_use_candidate_targets: false
  heatmap_metric: aupr
  bootstrap_repeats: 100
  bootstrap_top_k: 10
  bootstrap_max_pairs: 100000
