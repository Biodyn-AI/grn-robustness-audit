project:
  name: scgpt-mechinterp
  seed: 42

paths:
  scgpt_repo: external/scGPT
  scgpt_checkpoint: external/scGPT_checkpoints/whole-human/best_model.pt
  scgpt_vocab: external/scGPT_checkpoints/whole-human/vocab.json
  tabula_sapiens_h5ad: data/raw/tabula_sapiens_kidney.h5ad
  gene_info_csv: external/gene_info.csv
  hgnc_alias_tsv: external/hgnc_complete_set.txt
  processed_h5ad: outputs/tabula_sapiens_processed.h5ad
  attention_scores: outputs/experiments/max_genes2000/attention_scores.npy
  attention_counts: outputs/experiments/max_genes2000/attention_counts.npy
  network_edges: outputs/experiments/max_genes2000/inferred_edges.tsv
  dorothea_tsv: external/networks/trrust_human.tsv

preprocess:
  min_genes: 200
  min_cells: 3
  normalize_total: 10000
  log1p: true
  hvg: 5000

scgpt_dataset:
  max_genes: 2000
  include_zero: false
  sort_by_expression: true
  pad_token_id: null
  cls_token_id: null

model:
  entrypoint: scgpt.model.TransformerModel
  model_args: {}
  prefix_to_strip: null
  forward_key_map:
    gene_ids: src
    gene_values: values
    src_key_padding_mask: src_key_padding_mask

attention:
  reduce_layers: true
  reduce_heads: true
  max_cells: null

network:
  threshold_percentile: 95
  top_k: 100
  candidate_sources_from_dorothea: true
  candidate_targets_from_dorothea: false

evaluation:
  dorothea_confidence:
    - A
    - B
    - C
    - D
