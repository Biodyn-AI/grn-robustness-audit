project:
  name: scgpt-mechinterp-perturbation-dixit-causal-dixit-tiny
  seed: 42

paths:
  causal_scores: outputs/causal_dixit_tiny/causal_scores.tsv
  perturbation_h5ad: data/perturb/dixit/perturb_processed_symbols.h5ad
  hgnc_alias_tsv: external/hgnc_complete_set.txt
  output_dir: outputs/perturb_validation/dixit_causal_dixit_tiny

perturbation_validation:
  obs_key: condition
  control_labels:
    - control
  delimiter: "+"
  allow_multi: false
  min_cells: 20
  top_k_targets: 200
  min_abs_delta: 0.0
  use_abs: true
  exclude_self: true
  score_mode: abs
